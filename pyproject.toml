[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gesales"
authors = [
    { name = "GEL", email = "info@ge.com" }
]
description = "invoice import"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe is added as a dependency by bench, not here
]

[tool.flit.module]
name = "gesales"

[project.urls]
Homepage = "https://github.com/<your-org>/gesales"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
